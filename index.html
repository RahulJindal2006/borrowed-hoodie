<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowed Hoodie · Shop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#222222;        
    --paper:#ffffff;
    --mist:#ecf2f3;      
    --stone:#666666;
    --line:#e6e6e6;
    --ok:#2f6b4f;
    --radius-lg:14px;
    --radius-sm:10px;
    --serif:"Libre Baskerville", Georgia, "Times New Roman", serif;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --wrap:1040px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}


  .announce{background:var(--ink);color:#fff;text-align:center;font-size:.8rem;letter-spacing:.06em;padding:9px 16px}
  header.site{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 24px;max-width:var(--wrap);margin:0 auto}
  .brand{font-weight:700;font-size:1.5rem;letter-spacing:-.02em;text-decoration:none}
  nav.main{display:flex;align-items:center;gap:36px}
  nav.main a{text-decoration:none;font-size:.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  nav.main a:hover{opacity:.6}
  .cart-btn{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:.9rem;background:var(--paper)}
  .cart-btn svg{width:18px;height:18px}
  .count{min-width:22px;height:22px;border-radius:999px;background:var(--ink);color:#fff;font-size:.75rem;display:inline-grid;place-items:center;padding:0 6px}
  .count.bump{animation:bump .35s ease}
  @keyframes bump{50%{transform:scale(1.35)}}
  @media (max-width:760px){nav.main .link{display:none} .bar{padding:16px 20px} .brand{font-size:1.25rem}}

  main{min-height:60vh;padding:40px 0 96px}
  h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0}
  .crumbs{font-size:.88rem;color:var(--stone);margin-bottom:28px}
  .crumbs a{color:var(--ink)}


  .product{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:start}
  .product .photo{border-radius:var(--radius-lg);overflow:hidden;background:var(--mist)}
  .product .photo img{width:100%;aspect-ratio:1/1;object-fit:cover}
  .badge{font-size:.85rem;font-weight:600;color:var(--stone);margin:0 0 10px}
  .product h1{font-size:clamp(2rem,4vw,2.75rem);margin-bottom:14px}
  .price{font-size:1.5rem;font-weight:700;margin:0 0 18px}
  .desc{color:#444;margin:0 0 28px;max-width:52ch}
  .field{margin-bottom:24px}
  .field-label{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:10px}
  .field-label span{font-weight:400;color:var(--stone)}
  .sizes{display:flex;flex-wrap:wrap;gap:8px}
  .size{min-width:52px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);font-weight:600;font-size:.92rem}
  .size[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .size:hover{border-color:var(--ink)}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:var(--radius-sm);overflow:hidden}
  .qty button{width:46px;height:46px;border:0;background:var(--paper);font-size:1.2rem}
  .qty button:hover{background:var(--mist)}
  .qty input{width:54px;height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-weight:600;-moz-appearance:textfield}
  .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:15px 26px;border-radius:var(--radius-sm);border:1px solid var(--ink);font-weight:600;text-decoration:none;font-size:1rem}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#000}
  .btn.ghost{background:var(--paper)}
  .btn.ghost:hover{background:var(--mist)}
  .btn.block{width:100%}
  .added{display:none;margin-top:14px;padding:14px 16px;border-radius:var(--radius-sm);background:#e9f4ee;color:var(--ok);font-weight:600;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .added.show{display:flex}
  .added a{color:var(--ok)}
  .perks{margin-top:28px;padding:18px 20px;border-radius:var(--radius-sm);background:var(--mist);font-size:.92rem;color:#333}
  .perks p{margin:0}
  .perks p+p{margin-top:6px}
  @media (max-width:820px){.product{grid-template-columns:1fr;gap:28px}}


  .page-head{margin-bottom:32px}
  .page-head h1{font-size:clamp(2rem,4vw,2.75rem)}
  .page-head p{color:var(--stone);margin:8px 0 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
  .card{background:var(--mist);border-radius:var(--radius-lg);padding:14px 14px 18px;text-decoration:none;display:block}
  .card img{border-radius:var(--radius-sm);aspect-ratio:1/1;object-fit:cover;width:100%}
  .card h3{font-size:1.1rem;margin:14px 0 4px}
  .card .p{font-weight:700}


  .cart{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:start}
  .lines{border-top:1px solid var(--line)}
  .line{display:grid;grid-template-columns:104px 1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
  .line img{width:104px;height:104px;object-fit:cover;border-radius:var(--radius-sm);background:var(--mist)}
  .line h3{font-size:1.15rem;margin-bottom:4px}
  .line h3 a{text-decoration:none}
  .meta{color:var(--stone);font-size:.9rem;margin:0 0 10px}
  .line .qty button,.line .qty input{height:38px}
  .line .qty button{width:38px;font-size:1rem}
  .line .qty input{width:44px}
  .line-right{text-align:right}
  .line-total{font-weight:700;margin-bottom:8px}
  .remove{border:0;background:none;color:var(--stone);text-decoration:underline;font-size:.88rem;padding:0}
  .summary{background:var(--mist);border-radius:var(--radius-lg);padding:26px;position:sticky;top:110px}
  .summary h2{font-size:1.5rem;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;margin:10px 0}
  .row.total{border-top:1px solid #cfd8da;padding-top:14px;margin-top:16px;font-weight:700;font-size:1.15rem}
  .hint{font-size:.85rem;color:var(--stone);margin:6px 0 0}
  .summary .btn{margin-top:20px}
  .fineprint{font-size:.8rem;color:var(--stone);margin:12px 0 0;text-align:center}
  .empty,.thanks{text-align:center;max-width:560px;margin:40px auto}
  .empty h1,.thanks h1{font-size:clamp(2rem,4vw,2.75rem);margin-bottom:12px}
  .empty p,.thanks p{color:var(--stone);margin:0 0 28px}
  .thanks .mark{width:72px;height:72px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 24px}
  .thanks .mark svg{width:34px;height:34px}
  @media (max-width:820px){.cart{grid-template-columns:1fr}.summary{position:static}}
  @media (max-width:520px){.line{grid-template-columns:80px 1fr}.line img{width:80px;height:80px}.line-right{grid-column:2;text-align:left}}


  .steps{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 28px;font-size:.85rem;font-weight:600;color:var(--stone)}
  .steps li{display:flex;align-items:center;gap:8px}
  .steps li+li::before{content:"";width:22px;height:1px;background:var(--line);margin-right:2px}
  .steps .n{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem}
  .steps .on{color:var(--ink)}
  .steps .on .n{background:var(--ink);border-color:var(--ink);color:#fff}
  .steps .done .n{background:var(--ok);border-color:var(--ok);color:#fff}


  .checkout{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-items:start}
  .panel{border:1px solid var(--line);border-radius:var(--radius-lg);padding:34px;margin-bottom:32px}
  .panel h2{font-size:1.35rem;margin-bottom:6px}
  .panel .sub{color:var(--stone);font-size:.92rem;margin:0 0 20px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:20px 20px}
  .form .full{grid-column:1/-1}
  .form label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
  .form input,.form select{width:100%;padding:12px 14px;border:1px solid #cfcfcf;border-radius:var(--radius-sm);font:inherit;font-size:.95rem;background:var(--paper);color:var(--ink)}
  .form input:focus,.form select:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .form .err{display:none;color:#a33a2b;font-size:.8rem;margin-top:5px}
  .form .bad input,.form .bad select{border-color:#a33a2b}
  .form .bad .err{display:block}
  @media (max-width:560px){.form{grid-template-columns:1fr}}
  .pay-status{min-height:1.2em;font-size:.9rem;margin:12px 0 0}
  .pay-status.error{color:#a33a2b}
  .pay-status.busy{color:var(--stone)}
  .cc-wrap{position:relative}
  .cc-brand{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.72rem;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:6px;background:var(--mist);color:var(--stone);pointer-events:none;transition:all .15s ease}
  .cc-brand.known{background:var(--ink);color:#fff}
  #f-cc{padding-right:120px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  #f-exp,#f-cvv{font-variant-numeric:tabular-nums}
  .form .good input{border-color:var(--ok)}
  #pay-btn{margin-top:22px}
  #pay-btn[disabled]{opacity:.8;cursor:progress}
  .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .secure{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--stone);margin-top:14px}
  .secure svg{width:16px;height:16px;flex:none}
  .mini{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #d7dfe1;font-size:.92rem}
  .mini:last-of-type{border-bottom:0}
  .mini .pic{position:relative}
  .mini img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#fff}
  .mini .q{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:999px;background:var(--stone);color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 5px}
  .mini .nm{font-weight:600;line-height:1.3}
  .mini .sz{color:var(--stone);font-size:.82rem}
  .edit-link{font-size:.88rem}
  @media (max-width:860px){.checkout{grid-template-columns:1fr}}


  .confirm{max-width:980px;margin:0 auto}
  .confirm-head{text-align:center;margin-bottom:44px}
  .confirm-head h1{font-size:clamp(1.9rem,3.6vw,2.6rem);margin-bottom:14px;line-height:1.2}
  .confirm-head p{color:var(--stone);margin:0}
  .ok-mark{width:72px;height:72px;border-radius:999px;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 22px}
  .ok-mark svg{width:34px;height:34px}
  .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0 0 32px}
  @media (max-width:860px){.facts{grid-template-columns:1fr 1fr}}
  @media (max-width:460px){.facts{grid-template-columns:1fr}}
  .facts div{background:var(--paper);padding:22px 24px}
  .facts dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin-bottom:8px}
  .facts dd{margin:0;font-weight:600;font-size:.98rem;line-height:1.45}
  .facts .nowrap{white-space:nowrap}
  .facts .pill{margin-bottom:6px}
  .pill{display:inline-block;background:#e9f4ee;color:var(--ok);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .two p{margin:0;line-height:1.6}
  @media (max-width:640px){.two{grid-template-columns:1fr}}
  .confirm-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  @media print{.announce,header.site,footer.site,.confirm-actions,.toast{display:none!important}}


  .toast{position:fixed;right:24px;top:96px;z-index:40;background:var(--ink);color:#fff;padding:14px 18px;border-radius:var(--radius-sm);box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;gap:14px;align-items:center;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
  .toast.show{opacity:1;transform:none;pointer-events:auto}
  .toast a{color:#fff;font-weight:600}

  footer.site{background:var(--ink);color:#fff;padding:48px 0 32px}
  footer.site .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
  footer.site a{color:#fff;text-decoration:none;margin-right:22px}
  footer.site a:hover{text-decoration:underline}
  footer.site .b{font-weight:700;font-size:1.25rem;margin:0 0 6px}
  footer.site p{margin:0;opacity:.8;font-size:.9rem}
</style>
</head>
<body>
<div class="announce">Free shipping on orders over $100 · Easy 30 Day Returns</div>
<header class="site">
  <div class="bar">
    <a class="brand" href="https://ebusiness121.wordpress.com/">Borrowed Hoodie</a>
    <nav class="main" aria-label="Main">
      <a class="link" href="https://ebusiness121.wordpress.com/">Home</a>
      <a class="link" href="https://ebusiness121.wordpress.com/products/">Shop</a>
      <a class="link" href="https://ebusiness121.wordpress.com/blog/">Journal</a>
      <a class="link" href="https://ebusiness121.wordpress.com/about/">About</a>
      <a class="cart-btn" href="#/cart" aria-label="Open cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        Cart <span class="count" id="count">0</span>
      </a>
    </nav>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<footer class="site">
  <div class="wrap">
    <div><p class="b">Borrowed Hoodie</p><p>Unisex essentials made to be shared.</p></div>
    <div>
      <a href="https://ebusiness121.wordpress.com/products/">Shop</a>
      <a href="https://ebusiness121.wordpress.com/blog/">Journal</a>
      <a href="https://ebusiness121.wordpress.com/about/">About</a>
      <a href="https://ebusiness121.wordpress.com/privacy-policy/">Privacy Policy</a>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText">Added to cart</span><a href="#/cart">View cart</a></div>

<script>
const IMG = "https://ebusiness121.wordpress.com/wp-content/uploads/2026/09/";
const SITE = "https://ebusiness121.wordpress.com/products/";
const PRODUCTS = [
  {slug:"heavyweight-tee", name:"Everyday Heavyweight Tee", price:32, cat:"Shirts", badge:"Bestseller", img:"everyday-heavyweight-tee-1.png", colour:"Bone",
   desc:"The tee everyone ends up stealing. A boxy, relaxed fit in thick 100% cotton that holds its shape wash after wash."},
  {slug:"oxford-shirt", name:"Relaxed Oxford Shirt", price:58, cat:"Shirts", badge:"Everyday staple", img:"relaxed-oxford-shirt-1.png", colour:"Light Blue",
   desc:"An oversized oxford button-up that looks sharp buttoned to the top and just as good thrown open over a tee."},
  {slug:"graphic-tee", name:"Washed Graphic Tee", price:36, cat:"Shirts", badge:"Limited print", img:"washed-graphic-tee-1.png", colour:"Washed Charcoal",
   desc:"Vintage-washed cotton with a soft, broken-in feel from day one and a minimal line-art print on the back."},
  {slug:"camp-shirt", name:"Cuban Collar Camp Shirt", price:52, cat:"Shirts", badge:"New", img:"cuban-collar-camp-shirt-1.png", colour:"Olive Leaf Print",
   desc:"A lightweight short-sleeve shirt with an open collar and easy drape. Made for warm days and late summer nights."},
  {slug:"waffle-lounge-set", name:"Cloud Waffle Lounge Set", price:68, cat:"Pajamas", badge:"Bestseller", img:"cloud-waffle-lounge-set-1.png", colour:"Oatmeal",
   desc:"A waffle-knit crewneck and matching joggers so soft you'll wear them all weekend, not just to bed."},
  {slug:"striped-pajama-set", name:"Classic Striped Cotton Set", price:74, cat:"Pajamas", badge:"Timeless", img:"classic-striped-cotton-set-1.png", colour:"Navy and White Stripe",
   desc:"A classic button-up top and drawstring pants with contrast piping, cut from crisp, breathable cotton."},
  {slug:"satin-sleep-set", name:"Midnight Satin Sleep Set", price:82, cat:"Pajamas", badge:"New", img:"midnight-satin-sleep-set-1.png", colour:"Midnight Navy",
   desc:"A smooth, silky short-sleeve top and shorts in deep navy. Cool to the touch and effortlessly polished."},
  {slug:"fleece-hoodie", name:"Heavyweight Fleece Hoodie", price:78, cat:"Hoodies", badge:"Bestseller", img:"heavyweight-fleece-hoodie-1.png", colour:"Black",
   desc:"Our signature piece. Thick brushed fleece, dropped shoulders and a double-lined hood. Warm, structured and built to last."},
  {slug:"zip-hoodie", name:"Garment-Dyed Zip Hoodie", price:84, cat:"Hoodies", badge:"Small batch", img:"garment-dyed-zip-hoodie-1.png", colour:"Faded Sage",
   desc:"Dyed after sewing for a faded, lived-in colour that makes every piece one of a kind, with a full metal zip."},
  {slug:"boxy-hoodie", name:"Cropped Boxy Hoodie", price:76, cat:"Hoodies", badge:"New", img:"cropped-boxy-hoodie-1.png", colour:"Cream",
   desc:"Shorter and boxier, with a wide hood and ribbed hem. Pairs perfectly with high-waisted pants or joggers."}
];
const SIZES = ["XS","S","M","L","XL","XXL"];
const FREE_SHIP = 100, SHIP_FEE = 9.99, TAX_RATE = 0.13; // 13% HST (Ontario)

const CURRENCY = "CAD";
const bySlug = s => PRODUCTS.find(p => p.slug === s);
const money = n => "$" + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const imgUrl = p => IMG + p.img + "?w=800";


let memoryCart = [];
function loadCart(){ try{ const v = JSON.parse(localStorage.getItem("bh-cart") || "[]"); return Array.isArray(v) ? v : []; }catch(e){ return memoryCart; } }
function saveCart(c){ memoryCart = c; try{ localStorage.setItem("bh-cart", JSON.stringify(c)); }catch(e){} updateCount(); }
function cartQty(){ return loadCart().reduce((n,i)=>n+i.qty,0); }
function updateCount(bump){ const el = document.getElementById("count"); el.textContent = cartQty(); if(bump){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }

function addToCart(slug,size,qty){
  const c = loadCart();
  const hit = c.find(i => i.slug===slug && i.size===size);
  if(hit) hit.qty = Math.min(99, hit.qty + qty); else c.push({slug,size,qty});
  saveCart(c); updateCount(true);
}

let toastTimer;
function toast(msg){
  document.getElementById("toastText").textContent = msg;
  const t = document.getElementById("toast"); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 3200);
}


function viewShop(){
  return `<div class="page-head"><h1>Shop the collection</h1><p>Ten unisex pieces in sizes XS–XXL. Pick one to choose your size and quantity.</p></div>
  <div class="grid">${PRODUCTS.map(p=>`
    <a class="card" href="#/product/${p.slug}"><img src="${imgUrl(p)}" alt="${esc(p.name)}" loading="lazy"><h3>${esc(p.name)}</h3><div class="p">${money(p.price)}</div></a>`).join("")}
  </div>`;
}

function viewProduct(p){
  return `<p class="crumbs"><a href="https://ebusiness121.wordpress.com/">Home</a> / <a href="${SITE}">Shop</a> / <a href="${SITE}#${p.cat.toLowerCase()}">${p.cat}</a> / ${esc(p.name)}</p>
  <div class="product">
    <div class="photo"><img src="${imgUrl(p)}" alt="${esc(p.name)} in ${esc(p.colour)}"></div>
    <div>
      <p class="badge">${esc(p.badge)}</p>
      <h1>${esc(p.name)}</h1>
      <p class="price">${money(p.price)} CAD</p>
      <p class="desc">${esc(p.desc)}</p>
      <div class="field">
        <div class="field-label">Size <span>Unisex fit · ${esc(p.colour)}</span></div>
        <div class="sizes" role="group" aria-label="Size">${SIZES.map(s=>`<button type="button" class="size" data-size="${s}" aria-pressed="${s==="M"}">${s}</button>`).join("")}</div>

function totals(lines){
  const sub = lines.reduce((s,l) => s + cents(l.p.price) * l.qty, 0);
  const ship = sub >= cents(FREE_SHIP) || sub === 0 ? 0 : cents(SHIP_FEE);
  const tax = Math.round((sub + ship) * TAX_RATE);
  return {sub, ship, tax, total: sub + ship + tax};
}

function readForm(show){

  });

   Card details are validated in the browser (brand, length, Luhn checksum,
   expiry, CVV) and never sent anywhere or saved. Only the brand and last 4
   digits are kept for the receipt. A few special numbers simulate failures. */
const DEMO_CARD = "1234123412341234";
const TEST_CARDS = {
  "4242424242424242": {ok:true},                            
  "4000056655665556": {ok:true},                               
  "5555555555554444": {ok:true},                  
  "2223003122003222": {ok:true},                         
  "378282246310005":  {ok:true},                                  
  "6011111111111117": {ok:true},                           
  "3566002020360505": {ok:true},                                  
  "36227206271667":   {ok:true},                                
  "6200000000000005": {ok:true},                                   
  "4000000000000002": {ok:false, msg:"Your card was declined. Try a different card."},
  "4000000000009995": {ok:false, msg:"Your card has insufficient funds. Try a different card."},
  "4000000000000069": {ok:false, msg:"Your card has expired. Try a different card."},
  "4000000000000127": {ok:false, msg:"Your card's security code is incorrect.", field:"cvc"}
};
const digits = v => String(v).replace(/\D/g, "");

function cardBrand(n){
  if(/^4/.test(n)) return "Visa";
  if(/^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(n)) return "Mastercard";
  if(/^3[47]/.test(n)) return "Amex";
  if(/^(6011|64[4-9]|65)/.test(n)) return "Discover";
  if(/^35(2[89]|[3-8]\d)/.test(n)) return "JCB";
  if(/^(36|30[0-5]|3095|38|39)/.test(n)) return "Diners Club";
  if(/^62/.test(n)) return "UnionPay";
  return "";
}
const cardLengths = b => ({Amex:[15], "Diners Club":[14,15,16,17,18,19], Visa:[13,16,19]})[b] || [16,17,18,19];
function luhn(n){ let s = 0, alt = false; for(let i = n.length - 1; i >= 0; i--){ let d = +n[i]; if(alt){ d *= 2; if(d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; }
function formatCard(n){
  const b = cardBrand(n);
  if(b === "Diners Club" && n.length <= 14) return [n.slice(0,4), n.slice(4,10), n.slice(10,14)].filter(Boolean).join(" ");
  if(b === "Amex") return [n.slice(0,4), n.slice(4,10), n.slice(10,15)].filter(Boolean).join(" ");
  return n.slice(0,19).replace(/(\d{4})(?=\d)/g, "$1 ");
}
function parseExp(v){ const d = digits(v); return {mm: +d.slice(0,2), yy: +d.slice(2,4), ok: d.length === 4}; }
function expValid(v){
  const {mm, yy, ok} = parseExp(v); if(!ok || mm < 1 || mm > 12) return "Enter a valid expiry date.";
  const now = new Date(), y = 2000 + yy, endOfMonth = new Date(y, mm, 1);
  if(endOfMonth <= now) return "Your card's expiry date is in the past.";
  if(y > now.getFullYear() + 20) return "Enter a valid expiry date.";
  return "";
}
function randId(len, chars){ let s = ""; const a = new Uint32Array(len); (window.crypto || {getRandomValues:x=>x.map(()=>Math.random()*4e9)}).getRandomValues(a); for(const n of a) s += chars[n % chars.length]; return s; }

function newOrderNumber(){
  return "BH-" + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).slice(2,5).toUpperCase();
}
let memoryOrders = [];
function loadOrders(){ try{ const v = JSON.parse(localStorage.getItem("bh-orders") || "[]"); return Array.isArray(v) ? v : []; }catch(e){ return memoryOrders; } }
function saveOrder(o){ const all = [o, ...loadOrders().filter(x => x.no !== o.no)].slice(0, 25); memoryOrders = all; try{ localStorage.setItem("bh-orders", JSON.stringify(all)); }catch(e){} }

function bindCheckout(){
  const form = document.getElementById("ship-form");
  if(!form) return;
  const status = document.getElementById("pay-status");
  const say = (msg, kind) => { status.textContent = msg; status.className = "pay-status " + (kind || ""); };
  form.addEventListener("input", e => {
    const d = {}; FIELDS.forEach(f => { const el = document.getElementById("f-"+f.id); if(el) d[f.id] = el.value.trim(); }); saveCustomer(d);
    const wrap = e.target.closest("[data-field]"); if(wrap) wrap.classList.remove("bad");
  });
  form.addEventListener("submit", e => e.preventDefault());

  const cardForm = document.getElementById("card-form");
  const num = document.getElementById("c-number"), name = document.getElementById("c-name");
  const exp = document.getElementById("c-exp"), cvc = document.getElementById("c-cvc");
  const brandEl = document.getElementById("c-brand"), payBtn = document.getElementById("pay-btn");
  const payLabel = payBtn.textContent;
  const cvcLabel = document.getElementById("c-cvc-label");
  const showBrand = b => {
    brandEl.textContent = b || "Card"; brandEl.classList.toggle("known", !!b);
    cvc.placeholder = b === "Amex" ? "4 digits" : "3 digits";
    cvcLabel.textContent = b === "Amex" ? "Security code (4 digits on front)" : "Security code (CVV)";
  };
  const mark = (key, msg) => { const w = cardForm.querySelector(`[data-card="${key}"]`); w.classList.toggle("bad", !!msg); if(msg) w.querySelector(".err").textContent = msg; };

  num.addEventListener("input", () => {
    const n = digits(num.value).slice(0, 19); num.value = formatCard(n);
    showBrand(cardBrand(n)); mark("number", ""); say("");
  });
  exp.addEventListener("input", e => {
    let d = digits(exp.value).slice(0, 4);
    if(d.length === 1 && +d > 1) d = "0" + d;
    exp.value = d.length > 2 ? d.slice(0,2) + " / " + d.slice(2) : (d.length === 2 && e.inputType !== "deleteContentBackward" ? d + " / " : d);
    mark("exp", "");
  });
  cvc.addEventListener("input", () => { cvc.value = digits(cvc.value).slice(0, 4); mark("cvc", ""); });
  name.addEventListener("input", () => mark("name", ""));


  cardForm.addEventListener("submit", e => {
    e.preventDefault(); say("");
    const customer = readForm(true);
    if(!customer){ say("Please complete your shipping details first.", "error"); return; }
    if(!cartLines().length){ say("Your cart is empty.", "error"); return; }

    const n = digits(num.value), brand = cardBrand(n);
    const demo = n === DEMO_CARD; // the placeholder number works with any name, expiry and CVV
    const errs = demo ? {
      number: "",
      name: name.value.trim() ? "" : "Enter the name on your card.",
      exp: exp.value.trim() ? "" : "Enter your card's expiry date.",
      cvc: cvc.value ? "" : "Enter your card's security code."
    } : {
      number: !n ? "Enter your card number." : !brand ? "We accept Visa, Mastercard, Amex, Discover, JCB, Diners Club and UnionPay." : !cardLengths(brand).includes(n.length) ? `Your ${brand} number is incomplete.` : !luhn(n) ? "Your card number is invalid." : "",
      name: name.value.trim() ? "" : "Enter the name on your card.",
      exp: exp.value.trim() ? expValid(exp.value) : "Enter your card's expiry date.",
      cvc: !cvc.value ? "Enter your card's security code." : cvc.value.length !== (brand === "Amex" ? 4 : 3) ? "Your card's security code is incomplete." : ""
    };
    Object.entries(errs).forEach(([k, m]) => mark(k, m));
    const firstBad = Object.keys(errs).find(k => errs[k]);
    if(firstBad){ ({number:num, name, exp, cvc})[firstBad].focus(); say("Please check your card details.", "error"); return; }

    const test = TEST_CARDS[n] || {ok:true};

    payBtn.disabled = true; payBtn.innerHTML = `<span class="spinner" aria-hidden="true"></span>Processing payment…`;
    say("Authorizing your card…", "busy");
    setTimeout(() => {
      payBtn.disabled = false; payBtn.textContent = payLabel;
      if(!test.ok){
        if(test.field) mark(test.field, test.msg); else mark("number", test.msg);
        say(test.msg, "error"); return;
      }
      const lines = cartLines(), t = totals(lines), no = newOrderNumber();
      saveOrder({
        no, placedAt: new Date().toISOString(), status: "PAID", customer, totals: t,
        card: {brand: brand || "Card", last4: n.slice(-4)},
        txn: "TXN-" + randId(8, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"),
        auth: randId(6, "0123456789"),
        items: lines.map(l => ({slug:l.p.slug, name:l.p.name, colour:l.p.colour, size:l.size, qty:l.qty, price:l.p.price}))
      });
      num.value = exp.value = cvc.value = name.value = "";
      saveCart([]);
      location.hash = "#/order/" + no;
    }, 1400);
  });
}

      <div style="margin-top:10px">${summaryRows(t)}</div>
    </section>
    <div class="confirm-actions">
      <a class="btn primary" href="${SITE}">Continue shopping</a>
      <button type="button" class="btn ghost" onclick="window.print()">Print receipt</button>
    </div>
  </div>`;
}

function render(){
  const view = document.getElementById("view");
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  let title = "Shop";
  if(parts[0] === "product" && bySlug(parts[1])){
    const p = bySlug(parts[1]); view.innerHTML = viewProduct(p); bindProduct(p); title = p.name;
  } else if(parts[0] === "cart"){
    view.innerHTML = viewCart(); bindCart(); title = "Your cart";
  } else if(parts[0] === "checkout"){
    view.innerHTML = viewCheckout(); bindCheckout(); title = "Checkout";
  } else if(parts[0] === "order"){
    view.innerHTML = viewOrder(decodeURIComponent(parts[1] || "")); title = "Order confirmed";
  } else if(parts[0] === "thanks"){
    const last = loadOrders()[0];
    if(last){ location.replace("#/order/" + last.no); return; }
    view.innerHTML = viewShop();
  } else {
    view.innerHTML = viewShop();
  }
  document.title = `${title} · Borrowed Hoodie`;
  window.scrollTo(0,0);
  updateCount();
}
window.addEventListener("hashchange", render);
window.addEventListener("storage", () => updateCount());
render();
</script>
</body>
</html>
